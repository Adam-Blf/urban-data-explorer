services:
  # ── Core ────────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16       # postgres:16 + pgvector extension
    restart: unless-stopped
    environment:
      - POSTGRES_DB=ude
      - POSTGRES_USER=ude
      - POSTGRES_PASSWORD=ude
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ude -d ude"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data        # persistance -> resilience aux redemarrages

  cassandra:
    image: cassandra:4.1
    restart: unless-stopped
    ports:
      - "9042:9042"
    healthcheck:                               # sonde de sante -> demarrage ordonne
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s
    volumes:
      - ./scripts:/scripts:ro
      - cassandradata:/var/lib/cassandra        # persistance -> resilience

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy              # ne demarre qu'une fois la base prete
      cassandra:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

  # ── Streaming (profil optionnel) ────────────────────────────────────────
  zookeeper:
    image: bitnami/zookeeper:3.9
    profiles: ["streaming"]
    restart: unless-stopped
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    ports:
      - "2181:2181"

  kafka:
    image: bitnami/kafka:3.7.0
    profiles: ["streaming"]
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - ALLOW_PLAINTEXT_LISTENER=yes
    ports:
      - "9092:9092"
    volumes:
      - ./scripts:/scripts:ro

  # ── Monitoring – Prometheus + Grafana (profil optionnel) ─────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: ["monitoring"]
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.1.0
    profiles: ["monitoring"]
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"

  # ── Data Lake (profil optionnel) ────────────────────────────────────────
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    profiles: ["lake"]
    restart: unless-stopped
    environment:
      - CLUSTER_NAME=ude
      - CORE_CONF_fs_defaultFS=hdfs://namenode:8020
    ports:
      - "9870:9870"
      - "8020:8020"

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    profiles: ["lake"]
    restart: unless-stopped
    depends_on:
      - namenode
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:8020
      - HDFS_CONF_dfs_replication=1

  hive-metastore-db:
    image: postgres:12
    profiles: ["lake"]
    restart: unless-stopped
    environment:
      - POSTGRES_DB=metastore
      - POSTGRES_USER=hive
      - POSTGRES_PASSWORD=hive

  hive-metastore:
    image: bde2020/hive-metastore:2.3.2-postgresql-metastore
    profiles: ["lake"]
    restart: unless-stopped
    depends_on:
      - namenode
      - datanode
      - hive-metastore-db
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:8020
      - HIVE_METASTORE_DB_TYPE=postgres
      - HIVE_METASTORE_HOST=hive-metastore
      - HIVE_METASTORE_USER=hive
      - HIVE_METASTORE_PASS=hive
      - HIVE_METASTORE_DB_HOST=hive-metastore-db

  hive-server:
    image: bde2020/hive:2.3.2-postgresql-metastore
    profiles: ["lake"]
    restart: unless-stopped
    depends_on:
      - hive-metastore
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:8020
      - HIVE_METASTORE_URIS=thrift://hive-metastore:9083
    ports:
      - "10000:10000"
    volumes:
      - ./hive/ddl:/hive/ddl:ro

# Volumes nommes : les donnees survivent a "docker compose down" (resilience C1.4)
volumes:
  pgdata:
  cassandradata:
  prometheusdata:
  grafanadata:
